<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Cream Order Form</title>
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <form action="" method="post">
    <h1>Ice Cream Order Form</h1>
    <fieldset>
      <legend class="title">Personal Information</legend>
      <div class="group">
        <label for="name">Name:</label>
        <input type="text" id="name" class="personal" placeholder="">
      </div>

      <div class="group">
        <label for="email">Email:</label>
        <input type="email" id="email" class="personal" placeholder="">
      </div>
    </fieldset>

    <fieldset>
      <legend class="title">Order Details</legend>
      <div class="group">
        <label for="flavors">Choose your flavor:</label>
        <select id="flavors" name="flavors">
          <option value="vanilla">Vanilla</option>
          <option value="chocolate">Chocolate</option>
          <option value="strawberry">Strawberry</option>
        </select>
      </div>

      <div class="group">
        <legend>Choose your cone:</legend>
        <input type="radio" id="waffle" name="cone" value="waffle-cone">
        <label for="waffle">Waffle Cone</label>

        <input type="radio" id="sugar" name="cone" value="sugar-cone">
        <label for="sugar">Sugar Cone</label>

        <input type="radio" id="cup" name="cone" value="cup">
        <label for="cup">Cup</label>
      </div>

      <div class="group">
        <legend>Toppings: </legend>
        <input type="checkbox" id="sprinkles" name="topping" value="sprinkles">
        <label for="sprinkles">sprinles</label>

        <input type="checkbox" id="nuts" name="topping" value="nuts">
        <label for="nuts">Nuts</label>

        <input type="checkbox" id="cherry" name="topping" value="cherry">
        <label for="cherry">cherry</label>

        <input type="checkbox" id="cream" name="topping" value="whipped-cream">
        <label for="cream">Whipped Cream</label>
      </div>

      <div class="group">
        <label for="comments" id="labelc">Additional Comments</label>
        <input type="text" id="comments" placeholder="">
      </div>
    </fieldset>
    <button type="submit">Submit Order</button>
  </form>

</body>

</html>
