<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Order Form</title>
</head>
<body>
    <form action="" method="post">
        <h1>Ice Cream Order Form</h1>
        <fieldset>
            <legend class="title">Personal Information</legend>
            <div class="group">
            <label for="name">Name</label>
            <input type="text" id="name" class="personal" placeholder="">
            </div>

            <div class="group">
                <label for="email">Email</label>
                <input type="email" id="email" class="personal" placeholder="">
            </div>
        </fieldset>
    </form>
</body>
</html>
